<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>開錠</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #d1d5db;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #e6e8ec; --muted: #9aa1ad; --line: #3a3f4a;
      --accent: #3b82f6; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
  }
  .card {
    width: 100%; max-width: 360px; padding: 32px 24px; text-align: center;
    background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #pulse {
    width: 100%; padding: 20px; font-size: 1.4rem; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--accent); color: #fff;
  }
  #status { margin-top: 20px; min-height: 1.6em; font-size: 1.25rem; font-weight: 600; }
  #raw {
    margin-top: 8px; min-height: 1.2em; color: var(--muted); word-break: break-all;
    font: .8rem ui-monospace, Consolas, monospace;
  }
  .health {
    display: flex; align-items: center; gap: 12px;
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  #health {
    padding: 6px 14px; font-size: .9rem; color: var(--text);
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
  }
  #healthStatus { min-width: 5em; font-size: .9rem; font-weight: 600; text-align: left; }
  .ok { color: var(--ok); }
  .busy { color: var(--warn); }
  .err { color: var(--err); }
</style>
</head>
<body>
  <div class="card">
    <button id="pulse">開錠</button>
    <div id="status"></div>
    <div id="raw"></div>
    <div class="health">
      <button id="health">接続確認</button>
      <span id="healthStatus"></span>
    </div>
  </div>

<script>
  const TIMEOUT_MS = 5000;
  const MESSAGE_MS = 10000; // how long result messages stay on screen

  // fetch() that gives up after TIMEOUT_MS. Returns [response, text].
  async function request(path, method) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(path, { method, cache: "no-store", signal: ctrl.signal });
      return [res, await res.text()];
    } finally {
      clearTimeout(timer);
    }
  }

  function resultOf(text) {
    try { return JSON.parse(text).result; } catch { return undefined; }
  }

  function show(el, text, cls) {
    el.textContent = text;
    el.className = cls || "";
  }

  // Runs clearFn after MESSAGE_MS. Returns a function that cancels it.
  function clearLater(clearFn) {
    const timer = setTimeout(clearFn, MESSAGE_MS);
    return () => clearTimeout(timer);
  }

  const pulseBtn = document.getElementById("pulse");
  const status = document.getElementById("status");
  const raw = document.getElementById("raw");

  let cancelPulseClear = () => {};

  pulseBtn.addEventListener("click", async () => {
    cancelPulseClear();
    pulseBtn.disabled = true;
    show(status, "送信中…");
    raw.textContent = "";
    try {
      const [res, text] = await request("/pulse", "POST");
      const result = resultOf(text);
      raw.textContent = text.trim();
      if (result === "ok") {
        show(status, "開錠しました", "ok");
      } else if (result === "busy") {
        show(status, "既に開錠中です", "busy");
      } else {
        show(status, "エラー：予期しない応答です", "err");
        raw.textContent = `HTTP ${res.status} ${text.trim()}`;
      }
    } catch {
      show(status, "エラー：応答がありませんでした", "err");
    } finally {
      pulseBtn.disabled = false;
      cancelPulseClear = clearLater(() => {
        show(status, "");
        raw.textContent = "";
      });
    }
  });

  const healthBtn = document.getElementById("health");
  const healthStatus = document.getElementById("healthStatus");

  let cancelHealthClear = () => {};

  healthBtn.addEventListener("click", async () => {
    cancelHealthClear();
    healthBtn.disabled = true;
    show(healthStatus, "確認中…");
    try {
      const [, text] = await request("/health", "GET");
      if (resultOf(text) === "ok") show(healthStatus, "OK", "ok");
      else show(healthStatus, "接続エラー", "err");
    } catch {
      show(healthStatus, "接続エラー", "err");
    } finally {
      healthBtn.disabled = false;
      cancelHealthClear = clearLater(() => show(healthStatus, ""));
    }
  });
</script>
</body>
</html>
