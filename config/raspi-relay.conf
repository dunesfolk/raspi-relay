# raspi-relay configuration
#
# The installer copies this file to /boot/firmware/raspi-relay.conf
# It is read on every boot. You can edit it from a Windows PC by putting
# the SD card in a card reader (the "bootfs" drive).
# Lines starting with # or ; are comments.

[network]
# Network interface to configure:
#   eth0  = wired LAN (Raspberry Pi 1 B/B+, 2, 3, 4, 5 ...)
#   wlan0 = Wi-Fi (Raspberry Pi Zero W / Zero 2 W ...). The Wi-Fi name and
#           password are set in Raspberry Pi Imager, not in this file.
interface = eth0

# IPv4: dhcp or static
ipv4_method = dhcp
# Used only when ipv4_method = static. Address/prefix (24 = 255.255.255.0)
ipv4_address = 192.168.1.50/24
ipv4_gateway = 192.168.1.1
# DNS servers, comma separated (optional)
ipv4_dns = 192.168.1.1

# IPv6: auto (SLAAC / DHCPv6), static, or disabled
ipv6_method = auto
# Used only when ipv6_method = static. Address/prefix
ipv6_address = fd00::50/64
# Optional
ipv6_gateway =
ipv6_dns =

[relay]
# BCM GPIO number connected to the relay IN pin (GPIO17 = physical pin 11)
gpio_pin = 17
# true  = relay jumper set to H (high-level trigger)  <- recommended
# false = relay jumper set to L (low-level trigger)
active_high = true

# Which relay terminals the circuit is wired to:
#   nc = COM + NC (recommended). Relay is OFF while idle; /pulse turns it ON.
#        If the Pi is off or crashes, the circuit stays CONNECTED.
#   no = COM + NO. Relay is ON while idle; /pulse turns it OFF.
#        If the Pi is off, booting or crashes, the circuit is BROKEN.
contact = nc

# How many seconds /pulse breaks the circuit (0.05 - 3600).
# POST /rearm reconnects the circuit early.
break_seconds = 1.0

[server]
port = 8080
# Port for the web page (open http://{raspi_ip}/ in a browser).
# The API (/pulse, /health ...) also works on this port. 0 = off.
web_port = 80
# :: listens on all IPv4 and IPv6 addresses
bind = ::
